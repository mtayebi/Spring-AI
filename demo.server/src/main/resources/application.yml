server:
  port: 1010
spring:
  application:
    name: AI-server
  datasource:
    url: jdbc:postgresql://localhost:5432/Bank
    username: bank_admin
    password: 12345678
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  ai:
    mcp:
      server:
        protocol: STREAMABLE
default:
  schema:
    "public"
  table:
    "users"

logging:
  level:
    org.springframework.ai.mcp: TRACE
    io.modelcontextprotocol: TRACE